# Le bridage de l'agent Grafana Alloy sur la machine Oracle (etape 5.15), installe par
# installer.sh en /etc/systemd/system/alloy.service.d/neon-ninja.conf.
#
# L'agent ne doit jamais prendre au jeu ce qu'il lui faut: un quart de coeur et 300 Mo au
# plus. Au-dela, systemd le freine, ou l'arrete et le relance; le jeu ne s'en apercoit pas.
# Ses secrets, les adresses de la pile Grafana Cloud et le jeton d'ecriture, sont lus ici,
# par systemd, dans un fichier que seul l'administrateur lit.

[Service]
EnvironmentFile=/etc/neon-ninja/alloy
CPUQuota=25%
MemoryMax=300M
Restart=always
RestartSec=10
