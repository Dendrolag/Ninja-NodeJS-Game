# Integration continue.
#
# C'est le mecanisme qui transforme les tests en garantie reelle: si ce workflow
# est rouge, la fusion est bloquee. Aucune evolution n'entre dans la branche
# principale sans passer le filet.
#
# Ordre volontaire, du plus rapide au plus lent, pour echouer tot:
# formatage, types, linter, tests unitaires, puis bout en bout.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Une nouvelle poussee sur la meme branche annule l'execution precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verification:
    name: Types, linter et tests
    runs-on: ubuntu-latest
    # Les tests de la base creent leur propre branche Neon, puis la suppriment.
    # Sans ces secrets, ils font echouer la CI plutot que d'etre sautes.
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Verifier le formatage
        run: pnpm format:check

      - name: Verifier les types
        run: pnpm typecheck

      # Le schema de la base et ses migrations ne divergent jamais: on regenere
      # les migrations, et le moindre fichier ajoute ou modifie fait echouer la CI.
      # Place apres les types, parce que drizzle-kit lit la compilation de shared.
      - name: Verifier que les migrations suivent le schema de la base
        run: |
          pnpm base:generer
          git status --porcelain packages/server/migrations
          test -z "$(git status --porcelain packages/server/migrations)"

      - name: Linter (dont l'invariant de purete de packages/sim)
        run: pnpm lint

      - name: Tests unitaires et d'integration
        run: pnpm test

  bout-en-bout:
    name: Bout en bout
    runs-on: ubuntu-latest
    # Inutile de lancer les navigateurs si la verification rapide a deja echoue.
    needs: verification
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Installer les dependances
        run: pnpm install --frozen-lockfile

      - name: Installer les navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Scenarios de bout en bout
        run: pnpm test:e2e

      - name: Conserver le rapport en cas d'echec
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
