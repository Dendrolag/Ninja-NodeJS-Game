document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ate({ screen: this.props.startScreen });\n    }\n  }\n\n  go = (s) => () => { this.setState({ screen: s }); const m=document.querySelector('main'); if(m) m.scrollTop=0; };\n\n  send = () => {\n    const t = this.state.chatDraft.trim(); if(!t) return;\n    this.setState(s => ({ chat:[...s.chat, {who:'Vous', txt:t, me:true, c:'#2DE6E0'}], chatDraft:'' }));\n  };\n\n  renderVals() {\n    const s = this.state;\n    const player = {\n      name:'ShadowFox', initials:'SF', level:27, rank:'Diamant II',\n      coins:'4 280', gems:'112', xpCur:6420, xpMax:9000,\n    };\n    player.xpDeg = Math.round(player.xpCur/player.xpMax*360)+'deg';\n    player.xpPct = Math.round(player.xpCur/player.xpMax*100);\n\n    const mk = (k) => this.state.screen===k;\n    const navItem = (key,label,icon) => ({\n      label, icon, go:this.go(key),\n      color: mk(key)?'#EAF0FF':'#818EAC',\n      bg: mk(key)?'rgba(45,230,224,.12)':'transparent',\n      border: mk(key)?'rgba(45,230,224,.30)':'transparent',\n      barH: mk(key)?'26px':'0px',\n    });\n\n    const labels = { home:'ACCUEIL', browse:'PARTIES', create:'CRÉER', lobby:'SALON', game:'EN JEU', results:'RÉSULTATS', profile:'PROFIL' };\n\n    const modes = [\n      { id:'classic', name:'Classique', tag:'4-12 J', icon:'ninja', color:'#2DE6E0', desc:'Capturez les vrais Ninjas cachés parmi les leurres.' },\n      { id:'mirror', name:'Miroir', tag:'4-8 J', icon:'mirror', color:'#8B7BFF', desc:'Carte et contrôles inversés en symétrie parfaite.' },\n      { id:'hunt', name:'Chasse', tag:'5-10 J', icon:'target', color:'#FF2E7E', desc:'Un traqueur, des proies. Survivez jusqu\\u2019au bout.' },\n      { id:'royale', name:'Battle Royale', tag:'8-16 J', icon:'royale', color:'#FFB23E', desc:'La zone se rétrécit. Dernier Ninja debout gagne.' },\n      { id:'teams', name:'Équipes', tag:'2x4 J', icon:'swords', color:'#4DF08A', desc:'Deux clans s\\u2019affrontent pour le contrôle du territoire.' },\n      { id:'chaos', name:'Chaos', tag:'6-12 J', icon:'tornado', color:'#FF5BD0', desc:'Tous les bonus et malus, intensité maximale.' },\n    ];\n    const modeById = Object.fromEntries(modes.map(m=>[m.id,m]));\n\n    const maps = [\n      { id:'rainy', name:'Rainy Tokyo', sub:'Néon · Pluie', c:'#2DE6E0' },\n      { id:'tokyo', name:'Tokyo', sub:'Urbain · Nuit', c:'#FF2E7E' },\n      { id:'spirit', name:'Spirit & Time', sub:'Vide · Infini', c:'#8B7BFF' },\n      { id:'shibuya', name:'Shibuya Cross', sub:'Foule · Chaos', c:'#FFB23E' },\n    ];\n\n    const allRooms = [\n      { host:'KageOni', mode:'classic', map:'rainy', cur:7, max:12, ping:24, priv:false, status:'En attente' },\n      { host:'Vyper_99', mode:'royale', map:'shibuya', cur:13, max:16, ping:41, priv:false, status:'En attente' },\n      { host:'Akumu', mode:'hunt', map:'tokyo', cur:6, max:10, ping:18, priv:false, status:'En jeu' },\n      { host:'NeoBlade', mode:'mirror', map:'spirit', cur:4, max:8, ping:62, priv:false, status:'En attente' },\n      { host:'Sora.exe', mode:'teams', map:'tokyo', cur:6, max:8, ping:33, priv:false, status:'En attente' },\n      { host:'GhostByte', mode:'chaos', map:'rainy', cur:9, max:12, ping:55, priv:false, status:'En jeu' },\n      { host:'Zenith', mode:'classic', map:'shibuya', cur:3, max:12, ping:29, priv:false, status:'En attente' },\n    ];\n    const rooms = allRooms.filter(r => s.browseFilter==='all' || r.mode===s.browseFilter)\n      .map(r => ({ ...r, m:modeById[r.mode], mp:maps.find(x=>x.id===r.map), full:r.cur>=r.max,\n        pingColor: r.ping<35?'#4DF08A':r.ping<55?'#FFB23E':'#FF2E7E' }));\n\n    const lobbyPlayers = [\n      { name:'ShadowFox', lvl:27, ready:s.lobbyReady, host:true, c:'#2DE6E0', initials:'SF' },\n      { name:'KageOni', lvl:41, ready:true, host:false, c:'#FF2E7E', initials:'KO' },\n      { name:'Vyper', lvl:18, ready:false, host:false, c:'#8B7BFF', initials:'VY' },\n      { name:'Akumu', lvl:33, ready:true, host:false, c:'#FFB23E', initials:'AK' },\n      { name:'NeoBlade', lvl:9, ready:true, host:false, c:'#4DF08A', initials:'NB' },\n      { name:'', lvl:0, ready:false, host:false, empty:true, initials:'' },\n      { name:'', lvl:0, ready:false, host:false, empty:true, initials:'' },\n      { name:'', lvl:0, ready:false, host:false, empty:true, initials:'' },\n    ];\n    lobbyPlayers.forEach(p=>{ p.filled = !p.empty; });\n    const readyCount = lobbyPlayers.filter(p=>!p.empty && p.ready).length;\n    const filledCount = lobbyPlayers.filter(p=>!p.empty).length;\n\n    const leaderboard = [\n      { rank:1, name:'KageOni', score:1840, me:false, c:'#FFB23E' },\n      { rank:2, name:'ShadowFox', score:1620, me:true, c:'#2DE6E0' },\n      { rank:3, name:'Akumu', score:1490, me:false, c:'#FF2E7E' },\n      { rank:4, name:'Vyper', score:1120, me:false, c:'#8B7BFF' },\n      { rank:5, name:'NeoBlade', score:870, me:false, c:'#4DF08A' },\n    ];\n\n    const podium = [\n      { place:2, name:'ShadowFox', letter:'S', score:1620, me:true, c:'#C7D0E6', h:'150px' },\n      { place:1, name:'KageOni', letter:'K', score:1840, me:false, c:'#FFB23E', h:'200px' },\n      { place:3, name:'Akumu', letter:'A', score:1490, me:false, c:'#FF8A5B', h:'112px' },\n    ];\n\n    const challenges = [\n      { t:'Capturez 15 vrais Ninjas', cur:11, max:15, xp:300, icon:'ninja' },\n      { t:'Gagnez 3 parties', cur:1, max:3, xp:500, icon:'trophy' },\n      { t:'Activez 10 bonus', cur:7, max:10, xp:200, icon:'bolt' },\n    ];\n\n    const freeR = [['coin','50'],['','—'],['palette','Skin'],['','—'],['coin','100'],['gem','5'],['','—'],['gift','Coffre']];\n    const premR = [['palette','Aura'],['sparkle','Trace'],['ninja','Skin Élite'],['coin','200'],['emote','Emote'],['gem','15'],['banner','Bannière'],['crown','Légendaire']];\n    const passTiers = Array.from({length:8}, (_,i)=>{\n      const n=i+18;\n      return { n, unlocked:n<=24, current:n===24,\n        free:{ icon:freeR[i][0], hasIcon:!!freeR[i][0], label:freeR[i][1] },\n        prem:{ icon:premR[i][0], hasIcon:!!premR[i][0], label:premR[i][1] } };\n    });\n\n    const skins = [\n      { name:'Kitsune', rarity:'Légendaire', c:'#FFB23E', owned:true, equipped:true },\n      { name:'Oni Rouge', rarity:'Épique', c:'#FF2E7E', owned:true, equipped:false },\n      { name:'Spectre', rarity:'Épique', c:'#8B7BFF', owned:true, equipped:false },\n      { name:'Glacier', rarity:'Rare', c:'#2DE6E0', owned:false, cost:'1 200', equipped:false },\n      { name:'Sakura', rarity:'Rare', c:'#FF5BD0', owned:false, cost:'1 200', equipped:false },\n      { name:'Void', rarity:'Légendaire', c:'#4DF08A', owned:false, cost:'2 500', equipped:false },\n    ];\n    skins.forEach(sk=>{ sk.locked = !sk.owned; });\n\n    const achievements = [\n      { t:'Première capture', done:true, icon:'target' },\n      { t:'Série de 5 victoires', done:true, icon:'flame' },\n      { t:'Maître du Miroir', done:true, icon:'mirror' },\n      { t:'1000 Ninjas capturés', done:false, icon:'ninja' },\n      { t:'Survivant Royale', done:false, icon:'royale' },\n      { t:'Légende de Tokyo', done:false, icon:'crown' },\n    ];\n    achievements.forEach(a=>{ a.iconColor = a.done ? '#2DE6E0' : '#5A6478'; });\n\n    const stats = [\n      { k:'Parties jouées', v:'1 284' },\n      { k:'Victoires', v:'437' },\n      { k:'Ratio V/D', v:'1.94' },\n      { k:'Ninjas capturés', v:'8 612' },\n      { k:'Meilleure série', v:'12' },\n      { k:'Temps de jeu', v:'214h' },\n    ];\n\n    return {\n      player, screenLabel: labels[s.screen],\n      goHome:this.go('home'), goProfile:this.go('profile'), goSettings:this.go('home'),\n      goBrowse:this.go('browse'), goCreate:this.go('create'), goLobby:this.go('lobby'),\n      goGame:this.go('game'), goResults:this.go('results'),\n      nav: [ navItem('home','Jouer','play'), navItem('browse','Parties','globe'), navItem('create','Créer','plus'), navItem('profile','Profil','diamond') ],\n      isHome:mk('home'), isBrowse:mk('browse'), isCreate:mk('create'),\n      isLobby:mk('lobby'), isGame:mk('game'), isResults:mk('results'), isProfile:mk('profile'),\n      modes, modeById, maps, rooms, lobbyPlayers, readyCount, filledCount, leaderboard, podium,\n      challenges, passTiers, skins, achievements, stats,\n      selMode: modeById[s.createMode], selMap: maps.find(m=>m.id===s.createMap),\n      createMode:s.createMode, createMap:s.createMap, createPrivacy:s.createPrivacy,\n      advOpen:s.advOpen, duration:s.duration, fakeNinjas:s.fakeNinjas, blackNinjas:s.blackNinjas,\n      browseFilter:s.browseFilter, joinCode:s.joinCode, chat:s.chat, chatDraft:s.chatDraft,\n      lobbyReady:s.lobbyReady,\n      setMode:(id)=>()=>this.setState({createMode:id}),\n      setMap:(id)=>()=>this.setState({createMap:id}),\n      setPrivacy:(v)=>()=>this.setState({createPrivacy:v}),\n      setFilter:(v)=>()=>this.setState({browseFilter:v}),\n      toggleAdv:()=>this.setState(st=>({advOpen:!st.advOpen})),\n      toggleReady:()=>this.setState(st=>({lobbyReady:!st.lobbyReady})),\n      onDuration:(e)=>this.setState({duration:+e.target.value}),\n      onFake:(e)=>this.setState({fakeNinjas:+e.target.value}),\n      toggleBlack:()=>this.setState(st=>({blackNinjas:!st.blackNinjas})),\n      onChat:(e)=>this.setState({chatDraft:e.target.value}),\n      onChatKey:(e)=>{ if(e.key==='Enter') this.send(); },\n      send:this.send,\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
